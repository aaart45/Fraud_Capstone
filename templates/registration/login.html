<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Log in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Light styling so default Django widgets don’t look too bare */
    .form-control-like input { width:100%; padding:.5rem .75rem; border:1px solid #ced4da; border-radius:.375rem; }
    .form-control-like input:focus { outline:0; border-color:#86b7fe; box-shadow:0 0 0 .25rem rgba(13,110,253,.25); }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width:520px">
    <h1 class="h4 mb-3">Log in</h1>

    {% if form.errors %}
      <div class="alert alert-danger">Invalid username or password.</div>
    {% endif %}
    {% if next and user.is_authenticated %}
      <div class="alert alert-warning">Your account doesn’t have access to that page.</div>
    {% endif %}

    <form method="post" novalidate class="card card-body">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
        <div class="form-control-like">{{ form.username }}</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
        <div class="form-control-like">{{ form.password }}</div>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>

    <p class="mt-3 text-muted">No account? <a href="{% url 'signup' %}">Sign up</a></p>
  </div>
</body>
</html>
